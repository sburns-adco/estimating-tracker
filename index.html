<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADCO Estimate Tracker</title>
<style>
  :root { color-scheme: light;
    --blue:#1d4e89; --blue-lt:#e8eff7; --green:#2e7d32; --green-lt:#e6f2e7;
    --amber:#b26a00; --amber-lt:#fdf3e3; --red:#b3261e;
    --ink:#1c1c1e; --mut:#6b7280; --line:#d9dee5; --bg:#f5f6f8; --card:#ffffff;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:var(--blue); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  header h1 { font-size:17px; font-weight:600; white-space:nowrap; }
  header select, header input, header button { font:inherit; }
  #projSelect { padding:6px 8px; border-radius:6px; border:none; min-width:200px; }
  .hbtn { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .hbtn:hover { background:rgba(255,255,255,.28); }
  nav { display:flex; gap:2px; background:var(--card); border-bottom:1px solid var(--line); padding:0 12px; overflow-x:auto; position:sticky; top:53px; z-index:19; }
  nav button { border:none; background:none; padding:11px 14px; cursor:pointer; font:inherit; color:var(--mut); border-bottom:3px solid transparent; white-space:nowrap; }
  nav button.act { color:var(--blue); border-bottom-color:var(--blue); font-weight:600; }
  nav button .pct { font-size:11px; background:var(--blue-lt); color:var(--blue); border-radius:10px; padding:1px 7px; margin-left:5px; }
  nav button .pct.done { background:var(--green-lt); color:var(--green); }
  main { max-width:1200px; margin:0 auto; padding:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:16px; color:var(--blue); margin-bottom:4px; }
  .card .sub { color:var(--mut); font-size:12.5px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--mut); padding:7px 8px; border-bottom:2px solid var(--line); }
  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.cat td { background:var(--blue-lt); font-weight:600; color:var(--blue); font-size:13px; padding:6px 8px; }
  tr.done-row td { background:#f4faf4; }
  input[type=text], textarea, select.cell { width:100%; border:1px solid transparent; border-radius:5px; padding:5px 6px; font:inherit; background:transparent; }
  input[type=text]:hover, textarea:hover { border-color:var(--line); background:#fff; }
  input[type=text]:focus, textarea:focus, select.cell:focus { outline:none; border-color:var(--blue); background:#fff; }
  textarea { resize:vertical; min-height:30px; }
  input[type=checkbox] { width:17px; height:17px; accent-color:var(--green); cursor:pointer; }
  .stamp { border:1px solid var(--line); background:#fff; border-radius:5px; padding:4px 8px; cursor:pointer; font-size:12px; color:var(--blue); white-space:nowrap; }
  .stamp:hover { background:var(--blue-lt); }
  .ts { font-size:12px; color:var(--ink); white-space:nowrap; }
  .ts .clr { color:var(--red); cursor:pointer; margin-left:5px; font-weight:600; text-decoration:none; }
  .addbtn { border:1px dashed var(--blue); color:var(--blue); background:none; border-radius:6px; padding:7px 14px; cursor:pointer; font:inherit; margin-top:10px; }
  .addbtn:hover { background:var(--blue-lt); }
  .addline { font-size:11.5px; font-weight:500; color:var(--blue); cursor:pointer; float:right; opacity:.75; }
  .addline:hover { opacity:1; text-decoration:underline; }
  .customrow { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .customrow input { border:1px solid var(--line); background:#fff; border-radius:5px; padding:5px 6px; font:inherit; }
  .customrow .lab { flex:1.2; }
  .customrow .val { flex:1; }
  h2 input.title { border:1px solid var(--line); border-radius:5px; padding:4px 8px; font:inherit; font-size:15px; color:var(--blue); font-weight:600; width:70%; }
  .del { border:none; background:none; color:var(--mut); cursor:pointer; font-size:15px; padding:2px 6px; }
  .del:hover { color:var(--red); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .grid2 { grid-template-columns:1fr; } }
  .fld { margin-bottom:10px; }
  .fld label { display:block; font-size:12px; color:var(--mut); margin-bottom:3px; }
  .fld input[type=text], .fld textarea { border:1px solid var(--line); background:#fff; }
  .dash { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; }
  .tile:hover { border-color:var(--blue); }
  .tile .t { font-size:12.5px; color:var(--mut); margin-bottom:6px; }
  .tile .v { font-size:22px; font-weight:700; color:var(--blue); }
  .bar { height:6px; background:var(--blue-lt); border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); border-radius:3px; }
  .bar i.full { background:var(--green); }
  .empty { text-align:center; color:var(--mut); padding:60px 20px; }
  .pill { display:inline-block; font-size:11px; border-radius:10px; padding:2px 9px; font-weight:600; }
  .pill.open { background:var(--amber-lt); color:var(--amber); }
  .pill.ans { background:var(--green-lt); color:var(--green); }
  dialog { border:1px solid var(--line); border-radius:12px; padding:22px; width:340px; }
  dialog::backdrop { background:rgba(0,0,0,.3); }
  dialog h3 { margin-bottom:14px; color:var(--blue); font-size:16px; }
  dialog .fld input { width:100%; }
  dialog .row { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .btn { border:none; border-radius:6px; padding:8px 16px; cursor:pointer; font:inherit; }
  .btn.pri { background:var(--blue); color:#fff; }
  .btn.sec { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .btn.danger { background:var(--red); color:#fff; }
  .meta { font-size:12px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>ADCO Estimate Tracker</h1>
  <select id="projSelect" onchange="switchProject(this.value)"></select>
  <button class="hbtn" onclick="openNewProj()">+ New Project</button>
  <button class="hbtn" onclick="renameProj()">Rename</button>
  <button class="hbtn" onclick="deleteProj()">Delete</button>
  <button class="hbtn" onclick="refreshAll()" title="Pull latest saved by teammates">&#8635; Refresh</button>
  <span style="flex:1"></span>
  <span id="savedAt" style="font-size:11.5px;opacity:.8"></span>
</header>
<div id="banner" style="display:none;background:#fdecea;color:#b3261e;padding:10px 18px;font-size:13px;border-bottom:1px solid #f5c6c2"></div>
<nav id="tabs"></nav>
<main id="main"></main>

<dialog id="npDlg">
  <h3>New Project</h3>
  <div class="fld"><label>Project # *</label><input type="text" id="npNum" placeholder="e.g. 26-1042"></div>
  <div class="fld"><label>Project Name</label><input type="text" id="npName" placeholder="e.g. Riverside Office Building"></div>
  <div class="row"><button class="btn sec" onclick="npDlg.close()">Cancel</button><button class="btn pri" onclick="createProj()">Create</button></div>
</dialog>

<script>
'use strict';
const UI_KEY = 'adco-estimate-tracker-ui'; // only remembers which project/tab you had open

/* ---------- Template definitions (from ADCO OneNote Estimate Template) ---------- */
const TAKEOFF = [
  ['Basic Building Info', ['Building Height','Building Sq ft.']],
  ['Wiring Devices', ['Power devices','Power devices branch wiring']],
  ['Lighting', ['Lighting fixtures counts','Lighting fixtures branch wiring']],
  ['Lighting Control', ['Lighting control','Lighting control branch wiring']],
  ['Mechanical (HVAC)', ['Mechanical equipment','VFD / Motor starters','Mechanical branch wiring / feeders']],
  ['Feeders', ['Feeders take off','Pull boxes','Wire chockers']],
  ['Distribution Equipment', ['Switchgear','Distribution panels / House panels','Transformers','Generator / ATS']],
  ['Telecom', ['Tele/data stub ups','Cable tray','Low voltage infrastructure conduits']],
  ['Security', ['Security devices stub ups']],
  ['Control Wiring', ['Generator / ATS control wiring']],
  ['Fire Alarm', ['Devices take off','FA branch wiring','Stub ups']],
  ['Grounding', ['Electrical grounding system','Low voltage grounding system']],
  ['Temp. Power', ['Temp. service','Temp. panels','Feeders for temp. gear / panels','Temp. lighting & outlets']],
];
const QUOTES = ['Distribution equipment','Emergency generator','Fire alarm','Lighting fixtures','Lighting control','Lightning protection','Electric heat','Snow melt','Heat tracing','Crane / Rigger'];
const MATSPEC = [
  ['Branch Wire', [['Type of wire (THHN, XHHW, etc.)',''],['Separate ground (Yes/No)','']]],
  ['Feeder Wire', [['Type (THHN / XHHW)',''],['Copper / Aluminum',''],['Separate ground (Yes/No)',''],['Conduit type','']]],
  ['Raceways', [['Underground conduit type (PVC, GRC, Fiberglass, etc.)',''],['Surface conduit type (EMT, GRC, etc.)',''],['Outdoor conduit type (GRC, Aluminum, IMC, etc.)',''],['Minimum conduit size (1/2″, etc.)',''],['Conduit fittings (Set screw, Compression, etc.)','']]],
  ['Disconnect Type', [['General duty?',''],['Heavy duty?','']]],
];
const BIDFORM = [
  ['Alternates', 'Are there any alternates? (Bond, GC allowance, etc.)'],
  ['Sales Tax', 'Is this project exempt from sales tax?'],
  ['Allowances', 'Should any cash allowances be included in the bid price?'],
  ['Special Insurance', 'Insurance requirements or (OCIP / CCIP)?'],
  ['Temporary Power', 'Who furnishes the temporary power?'],
];
const SECTIONS = [
  ['overview','Overview'],
  ['takeoff','1) Take Off'],
  ['quotes','2) Quotes'],
  ['matspec','3) Material Spec'],
  ['conest','4) ConEst / Bid Form'],
  ['rfi','5) RFI'],
  ['scope','6) Scope / Quals'],
];

/* ---------- State (shared via Azure Blob Storage through /api) ---------- */
let db = { projects:{} };
let cur = null;
let tab = 'overview';
const etags = {};          // project id -> blob ETag (concurrency protection)
const dirty = new Set();   // project ids with unsaved edits
let saveTimer = null;

function status(msg, isErr){
  const el = document.getElementById('savedAt');
  el.textContent = msg; el.style.color = isErr ? '#ffb4ab' : '';
}
function showBanner(msg){
  const b = document.getElementById('banner');
  if (!msg){ b.style.display='none'; return; }
  b.textContent = msg; b.style.display='block';
}
function saveUI(){
  try { localStorage.setItem(UI_KEY, JSON.stringify({cur, tab})); } catch(e){}
}
/* Called by every edit handler: marks project dirty, pushes to API after a short pause */
function save(){
  if (cur) dirty.add(cur);
  saveUI();
  status('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  for (const id of [...dirty]){
    dirty.delete(id);
    if (!db.projects[id]) continue;
    try {
      const headers = {'Content-Type':'application/json'};
      if (etags[id]) headers['If-Match'] = etags[id];
      const r = await fetch('api/projects/' + id, { method:'PUT', headers, body: JSON.stringify(db.projects[id]) });
      if (r.status === 409 || r.status === 412){
        showBanner('Heads up: someone else saved "' + (db.projects[id].num||id) + '" while you were editing. Loaded their latest version — please re-enter your last change.');
        await reloadProject(id); render(); continue;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      etags[id] = j.etag;
      showBanner('');
      status('Saved ' + new Date().toLocaleTimeString());
    } catch(e){
      dirty.add(id);
      status('⚠ Save failed — will retry', true);
      showBanner('Could not reach the server. Your edits are held in this window — click ↻ Refresh or keep working; saving will retry.');
      clearTimeout(saveTimer); saveTimer = setTimeout(flush, 5000);
      return;
    }
  }
}
async function reloadProject(id){
  const r = await fetch('api/projects/' + id);
  if (r.ok){ const j = await r.json(); db.projects[id] = j.data; etags[id] = j.etag; }
  else if (r.status === 404){ delete db.projects[id]; delete etags[id]; if (cur===id) cur = Object.keys(db.projects)[0] || null; }
}
async function refreshAll(){
  status('Loading…');
  try {
    const r = await fetch('api/projects');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    db.projects = {};
    arr.forEach(x => { db.projects[x.id] = x.data; etags[x.id] = x.etag; });
    if (!cur || !db.projects[cur]) cur = Object.keys(db.projects)[0] || null;
    showBanner(''); status('Up to date ' + new Date().toLocaleTimeString());
  } catch(e){
    status('⚠ Offline', true);
    showBanner('Could not load from the server (' + e.message + '). Check that the app is deployed with its API and the STORAGE_CONNECTION_STRING setting is configured.');
  }
  render();
}
function newProject(num, name){
  return {
    num, name, created: new Date().toISOString(),
    takeoff: TAKEOFF.flatMap(([cat,items]) => items.map(it => ({cat, item:it, estimator:'', conest:false, start:'', done:'', notes:''}))),
    quotes: QUOTES.map(q => ({item:q, req:false, sent:false, vendors:'', custom:false})),
    matspec: MATSPEC.map(([cat,fields]) => ({cat, fields: fields.map(([lab]) => ({lab, val:''}))})),
    conestItems: [],
    bidform: BIDFORM.map(([t,q]) => ({t, q, ans:''})),
    rfis: [],
    scope: [],
  };
}
function P(){ return db.projects[cur]; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function now(){ const d=new Date(); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

/* ---------- Progress ---------- */
function prog(p){
  const tk = p.takeoff.length ? p.takeoff.filter(r=>r.conest).length / p.takeoff.length : 0;
  const reqQ = p.quotes.filter(q=>q.req);
  const qt = reqQ.length ? reqQ.filter(q=>q.sent).length / reqQ.length : null;
  const msTot = p.matspec.reduce((a,c)=>a+c.fields.length,0);
  const ms = msTot ? p.matspec.reduce((a,c)=>a+c.fields.filter(f=>f.val.trim()).length,0)/msTot : 0;
  const bf = p.bidform.length ? p.bidform.filter(b=>b.ans.trim()).length / p.bidform.length : 0;
  const rfiOpen = p.rfis.filter(r=>!r.answered).length;
  return {tk, qt, qtReq:reqQ.length, ms, bf, rfiOpen, rfiTot:p.rfis.length, scope:p.scope.length};
}

/* ---------- Rendering ---------- */
function render(){
  renderHeader(); renderTabs();
  const m = document.getElementById('main');
  if (!cur || !P()){ m.innerHTML = '<div class="empty"><p style="font-size:16px;margin-bottom:10px">No project selected.</p><button class="btn pri" onclick="openNewProj()">+ Create your first project</button></div>'; return; }
  ({overview:rOverview, takeoff:rTakeoff, quotes:rQuotes, matspec:rMatspec, conest:rConest, rfi:rRfi, scope:rScope})[tab]();
}
function renderHeader(){
  const sel = document.getElementById('projSelect');
  const ids = Object.keys(db.projects).sort((a,b)=>db.projects[a].num.localeCompare(db.projects[b].num));
  sel.innerHTML = ids.length ? ids.map(id => `<option value="${id}" ${id===cur?'selected':''}>${esc(db.projects[id].num)}${db.projects[id].name?' — '+esc(db.projects[id].name):''}</option>`).join('') : '<option>— no projects —</option>';
}
function renderTabs(){
  const t = document.getElementById('tabs');
  if (!cur || !P()){ t.innerHTML=''; return; }
  const pr = prog(P());
  const pct = {takeoff:pr.tk, quotes:pr.qt, matspec:pr.ms, conest:pr.bf};
  t.innerHTML = SECTIONS.map(([id,label]) => {
    let badge = '';
    if (id in pct && pct[id] !== null && pct[id] !== undefined){
      const v = Math.round(pct[id]*100);
      badge = `<span class="pct ${v===100?'done':''}">${v}%</span>`;
    }
    if (id==='rfi' && pr.rfiTot) badge = `<span class="pct ${pr.rfiOpen? '':'done'}">${pr.rfiTot-pr.rfiOpen}/${pr.rfiTot}</span>`;
    return `<button class="${tab===id?'act':''}" onclick="tab='${id}';render()">${label}${badge}</button>`;
  }).join('');
}

function tsCell(val, path){
  if (val) return `<span class="ts">${esc(val)}<a class="clr" title="Clear" onclick="setVal('${path}','')">✕</a></span>`;
  return `<button class="stamp" onclick="setVal('${path}', now())">⏱ Stamp</button>`;
}
function setVal(path, val){
  const [arr, i, key] = path.split('|');
  P()[arr][+i][key] = val;
  save(); render();
}
function setField(ci, fi, val){ P().matspec[ci].fields[fi].val = val; save(); renderTabs(); }
function msSetLab(ci, fi, val){ P().matspec[ci].fields[fi].lab = val; save(); }
function msSetCat(ci, val){ P().matspec[ci].cat = val; save(); }
function msAddField(ci){ P().matspec[ci].fields.push({lab:'', val:'', custom:true}); save(); render(); }
function msDelField(ci, fi){ P().matspec[ci].fields.splice(fi,1); save(); render(); }
function msAddSection(){ P().matspec.push({cat:'', fields:[{lab:'', val:'', custom:true}], custom:true}); save(); render(); }
function msDelSection(ci){ if(!confirm('Remove this section?')) return; P().matspec.splice(ci,1); save(); render(); }

/* ---- Overview ---- */
function rOverview(){
  const p = P(), pr = prog(p);
  const tile = (label, val, bar, target) => `
    <div class="tile" onclick="tab='${target}';render()">
      <div class="t">${label}</div><div class="v">${val}</div>
      ${bar!==null?`<div class="bar"><i class="${bar>=1?'full':''}" style="width:${Math.round(bar*100)}%"></i></div>`:''}
    </div>`;
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h2>${esc(p.num)}${p.name?' — '+esc(p.name):''}</h2>
      <div class="sub">ADCO Estimate Template · created ${new Date(p.created).toLocaleDateString()}</div>
      <div class="fld"><label>Project overview / general notes</label>
        <textarea rows="3" onchange="P().overviewNotes=this.value;save()">${esc(p.overviewNotes||'')}</textarea></div>
    </div>
    <div class="dash">
      ${tile('Take off in ConEst', Math.round(pr.tk*100)+'%', pr.tk, 'takeoff')}
      ${tile('Quotes sent', pr.qtReq? Math.round(pr.qt*100)+'%' : '—', pr.qtReq?pr.qt:0, 'quotes')}
      ${tile('Material spec filled', Math.round(pr.ms*100)+'%', pr.ms, 'matspec')}
      ${tile('Bid form answered', Math.round(pr.bf*100)+'%', pr.bf, 'conest')}
      ${tile('Open RFIs', pr.rfiOpen + ' / ' + pr.rfiTot, null, 'rfi')}
      ${tile('Scope qualifications', pr.scope, null, 'scope')}
    </div>
    <div class="card"><h2>Estimating Process</h2><div class="sub">Work through each tab in order — same flow as the OneNote template.</div>
      <ol style="padding-left:20px;line-height:1.9">
        <li>Take off</li><li>Quotes</li><li>Take off – Material Specification</li>
        <li>Items / systems not to forget in ConEst + Bid form</li><li>RFI</li><li>Scope / Proposal Qualifications</li>
      </ol></div>`;
}

/* ---- 1) Take off ---- */
function tkAdd(catIdx){
  const p = P();
  const cat = tkCats(p)[catIdx].cat;
  let lastIdx = -1;
  p.takeoff.forEach((r,i)=>{ if (r.cat===cat) lastIdx = i; });
  p.takeoff.splice(lastIdx+1, 0, {cat, item:'', estimator:'', conest:false, start:'', done:'', notes:'', custom:true});
  save(); render();
}
function tkDel(i){ P().takeoff.splice(i,1); save(); render(); }
function tkAddCat(){
  const cat = (prompt('New category name:')||'').trim();
  if (!cat) return;
  P().takeoff.push({cat, item:'', estimator:'', conest:false, start:'', done:'', notes:'', custom:true});
  save(); render();
}
function tkCats(p){
  const cats = [];
  p.takeoff.forEach((r,i)=>{ let c = cats.find(x=>x.cat===r.cat); if(!c){ c={cat:r.cat, idx:[]}; cats.push(c);} c.idx.push(i); });
  return cats;
}
function rTakeoff(){
  const p = P();
  const rows = tkCats(p).map((c,ci) =>
    `<tr class="cat"><td colspan="6">${esc(c.cat)}<span class="addline" onclick="tkAdd(${ci})">+ Add line item</span></td></tr>` +
    c.idx.map(i => { const r = p.takeoff[i]; return `<tr class="${r.conest?'done-row':''}">
      <td style="min-width:190px">${r.custom
        ? `<div style="display:flex;gap:4px;align-items:center"><button class="del" onclick="tkDel(${i})" title="Remove">✕</button><input type="text" value="${esc(r.item)}" placeholder="Line item…" onchange="setVal('takeoff|${i}|item', this.value)"></div>`
        : '• '+esc(r.item)}</td>
      <td style="width:130px"><input type="text" value="${esc(r.estimator)}" placeholder="Initials" onchange="setVal('takeoff|${i}|estimator', this.value)"></td>
      <td style="width:80px;text-align:center"><input type="checkbox" ${r.conest?'checked':''} onchange="setVal('takeoff|${i}|conest', this.checked)"></td>
      <td style="width:150px">${tsCell(r.start, `takeoff|${i}|start`)}</td>
      <td style="width:150px">${tsCell(r.done, `takeoff|${i}|done`)}</td>
      <td style="min-width:150px"><input type="text" value="${esc(r.notes)}" onchange="setVal('takeoff|${i}|notes', this.value)"></td>
    </tr>`; }).join('')
  ).join('');
  document.getElementById('main').innerHTML = `
    <div class="card"><h2>1) Take Off</h2><div class="sub">Check "In ConEst" when the takeoff is entered. Stamp buttons record date &amp; time. Use "+ Add line item" on any category header for custom items.</div>
    <table><thead><tr><th>Take off</th><th>Estimator</th><th>In ConEst</th><th>Time Started</th><th>Time Completed</th><th>Notes</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <button class="addbtn" onclick="tkAddCat()">+ Add category</button></div>`;
}

/* ---- 2) Quotes ---- */
function rQuotes(){
  const p = P();
  const rows = p.quotes.map((q,i) => `<tr class="${q.req&&q.sent?'done-row':''}">
    <td style="min-width:170px">${q.custom
        ? `<input type="text" value="${esc(q.item)}" onchange="setVal('quotes|${i}|item', this.value)">`
        : '• '+esc(q.item)}</td>
    <td style="width:110px;text-align:center"><input type="checkbox" ${q.req?'checked':''} onchange="setVal('quotes|${i}|req', this.checked)"></td>
    <td style="width:90px;text-align:center"><input type="checkbox" ${q.sent?'checked':''} ${q.req?'':'disabled'} onchange="setVal('quotes|${i}|sent', this.checked)"></td>
    <td><input type="text" value="${esc(q.vendors)}" placeholder="Vendor name / email" onchange="setVal('quotes|${i}|vendors', this.value)"></td>
    <td style="width:34px">${q.custom?`<button class="del" onclick="P().quotes.splice(${i},1);save();render()">✕</button>`:''}</td>
  </tr>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="card"><h2>2) Quotes</h2><div class="sub">Check "Required" for YES, then mark "Sent" and record vendors sent to (name / email).</div>
    <table><thead><tr><th>Quotes Required</th><th>Required (YES)</th><th>Sent</th><th>Vendors sent to (Name / Email)</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <button class="addbtn" onclick="P().quotes.push({item:'',req:true,sent:false,vendors:'',custom:true});save();render()">+ Anything else?</button></div>`;
}

/* ---- 3) Material spec ---- */
function rMatspec(){
  const p = P();
  const cards = p.matspec.map((c,ci) => `<div class="card">
    <h2 style="display:flex;align-items:center;gap:8px">${ci+1}. ${c.custom
      ? `<input class="title" type="text" value="${esc(c.cat)}" placeholder="Section name…" onchange="msSetCat(${ci},this.value)"><button class="del" onclick="msDelSection(${ci})" title="Remove section">✕</button>`
      : esc(c.cat)}</h2>
    <div style="margin-top:10px">
    ${c.fields.map((f,fi) => f.custom
      ? `<div class="customrow">
           <input class="lab" type="text" value="${esc(f.lab)}" placeholder="Spec item…" onchange="msSetLab(${ci},${fi},this.value)">
           <input class="val" type="text" value="${esc(f.val)}" placeholder="Value…" onchange="setField(${ci},${fi},this.value)">
           <button class="del" onclick="msDelField(${ci},${fi})" title="Remove">✕</button></div>`
      : `<div class="fld"><label>${esc(f.lab)}</label>
         <input type="text" value="${esc(f.val)}" onchange="setField(${ci},${fi},this.value)"></div>`).join('')}
    </div>
    <button class="addbtn" style="padding:4px 10px;font-size:12.5px" onclick="msAddField(${ci})">+ Add spec item</button>
  </div>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="card"><h2>3) Take Off — Material Specification</h2>
    <div class="sub">Type and grade of materials are defined in the electrical specifications — note them here and on the Scope of Work sheet.</div></div>
    <div class="grid2">${cards}</div>
    <button class="addbtn" onclick="msAddSection()">+ Add custom section</button>`;
}

/* ---- 4) ConEst + bid form ---- */
function rConest(){
  const p = P();
  const items = p.conestItems.map((it,i) => `<tr class="${it.done?'done-row':''}">
    <td style="width:34px;text-align:center"><input type="checkbox" ${it.done?'checked':''} onchange="setVal('conestItems|${i}|done',this.checked)"></td>
    <td><input type="text" value="${esc(it.txt)}" placeholder="Item / system not to forget…" onchange="setVal('conestItems|${i}|txt',this.value)"></td>
    <td style="width:34px"><button class="del" onclick="P().conestItems.splice(${i},1);save();render()">✕</button></td></tr>`).join('');
  const bid = p.bidform.map((b,i) => `<div class="fld"><label><b>${esc(b.t)}:</b> ${esc(b.q)}</label>
    <input type="text" value="${esc(b.ans)}" placeholder="Answer…" onchange="setVal('bidform|${i}|ans',this.value)"></div>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="card"><h2>4) Items / Systems Not to Forget in ConEst</h2><div class="sub">Running checklist of easy-to-miss items for this job.</div>
      <table><tbody>${items || ''}</tbody></table>
      <button class="addbtn" onclick="P().conestItems.push({txt:'',done:false});save();render()">+ Add item</button></div>
    <div class="card"><h2>Bid Form</h2><div class="sub">Answer each before finalizing the bid.</div>${bid}</div>`;
}

/* ---- 5) RFI ---- */
function rRfi(){
  const p = P();
  const rows = p.rfis.map((r,i) => `<tr class="${r.answered?'done-row':''}">
    <td style="width:50px">#${i+1}</td>
    <td><textarea rows="1" placeholder="Question…" onchange="setVal('rfis|${i}|q',this.value)">${esc(r.q)}</textarea></td>
    <td style="width:140px">${r.dateSent?`<span class="ts">${esc(r.dateSent)}</span>`:`<button class="stamp" onclick="setVal('rfis|${i}|dateSent', new Date().toLocaleDateString())">⏱ Sent today</button>`}</td>
    <td style="width:100px;text-align:center"><span class="pill ${r.answered?'ans':'open'}" style="cursor:pointer" onclick="setVal('rfis|${i}|answered', ${!r.answered})">${r.answered?'Answered':'Open'}</span></td>
    <td><textarea rows="1" placeholder="Answer / notes…" onchange="setVal('rfis|${i}|a',this.value)">${esc(r.a)}</textarea></td>
    <td style="width:34px"><button class="del" onclick="P().rfis.splice(${i},1);save();render()">✕</button></td>
  </tr>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="card"><h2>5) RFI List</h2><div class="sub">Track questions sent to the GC / engineer and their answers.</div>
    <table><thead><tr><th>#</th><th>Question</th><th>Date Sent</th><th>Status</th><th>Answer / Notes</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <button class="addbtn" onclick="P().rfis.push({q:'',dateSent:'',answered:false,a:''});save();render()">+ Add RFI</button></div>`;
}

/* ---- 6) Scope / quals ---- */
function rScope(){
  const p = P();
  const rows = p.scope.map((s,i) => `<tr>
    <td style="width:40px">${i+1}.</td>
    <td><textarea rows="1" placeholder="Qualification / exclusion…" onchange="setVal('scope|${i}|txt',this.value)">${esc(s.txt)}</textarea></td>
    <td style="width:34px"><button class="del" onclick="P().scope.splice(${i},1);save();render()">✕</button></td></tr>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="card"><h2>6) Scope / Proposal Qualifications</h2><div class="sub">Numbered qualifications for the proposal.</div>
    <table><tbody>${rows}</tbody></table>
    <button class="addbtn" onclick="P().scope.push({txt:''});save();render()">+ Add qualification</button></div>`;
}

/* ---------- Project management ---------- */
const npDlg = document.getElementById('npDlg');
function openNewProj(){ document.getElementById('npNum').value=''; document.getElementById('npName').value=''; npDlg.showModal(); }
function createProj(){
  const num = document.getElementById('npNum').value.trim();
  if (!num){ document.getElementById('npNum').focus(); return; }
  const id = 'p' + Date.now();
  db.projects[id] = newProject(num, document.getElementById('npName').value.trim());
  cur = id; tab = 'overview'; npDlg.close(); save(); render();
}
function switchProject(id){ if (db.projects[id]){ cur = id; saveUI(); render(); } }
function renameProj(){
  if (!cur || !P()) return;
  const num = prompt('Project #:', P().num); if (num===null) return;
  const name = prompt('Project name:', P().name||''); if (name===null) return;
  P().num = num.trim()||P().num; P().name = name.trim(); save(); render();
}
async function deleteProj(){
  if (!cur || !P()) return;
  if (!confirm(`Delete project ${P().num}? This deletes it for the whole team and cannot be undone.`)) return;
  const id = cur;
  try {
    const r = await fetch('api/projects/' + id, { method:'DELETE' });
    if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
    delete db.projects[id]; delete etags[id]; dirty.delete(id);
    cur = Object.keys(db.projects)[0] || null;
    saveUI(); render();
  } catch(e){ showBanner('Delete failed (' + e.message + '). Try again.'); }
}

/* Warn before closing with unsaved edits */
window.addEventListener('beforeunload', e => { if (dirty.size){ e.preventDefault(); e.returnValue=''; } });

/* ---------- Init ---------- */
(async function init(){
  try { const ui = JSON.parse(localStorage.getItem(UI_KEY)); if (ui){ cur = ui.cur; tab = ui.tab || 'overview'; } } catch(e){}
  await refreshAll();
  console.log('ADCO Estimate Tracker (Azure) loaded; projects:', Object.keys(db.projects).length);
})();
</script>
